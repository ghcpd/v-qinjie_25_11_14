<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Dashboard Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 4rem; color: #111; }
        form { max-width: 320px; display: flex; flex-direction: column; gap: 1rem; }
    </style>
</head>
<body>
    <h1>Secure Dashboard</h1>
    <form action="/login" method="post">
        <label>Username <input name="username" required></label>
        <label>Password <input name="password" type="password" required></label>
        <button type="submit">Login</button>
    </form>
</body>
</html>
